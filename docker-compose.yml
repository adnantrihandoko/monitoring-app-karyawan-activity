# =============================================================================
# Monitoring Karyawan Activity — Docker Compose
# =============================================================================
# Services: PostgreSQL 16 + Redis 7
# Usage: docker compose up -d
# =============================================================================

services:
  # ─── PostgreSQL 16 ──────────────────────────────────────────────────────────
  postgres:
    image: postgres:16-alpine
    container_name: monitoring-postgres
    restart: unless-stopped
    ports:
      - "${POSTGRES_PORT:-5432}:5432"
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-monitoring_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-monitoring_secret_2026}
      POSTGRES_DB: ${POSTGRES_DB:-monitoring_db}
      PGDATA: /var/lib/postgresql/data/pgdata
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-monitoring_user} -d ${POSTGRES_DB:-monitoring_db}"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - monitoring-network

  # ─── Redis 7 ───────────────────────────────────────────────────────────────
  redis:
    image: redis:7-alpine
    container_name: monitoring-redis
    restart: unless-stopped
    ports:
      - "${REDIS_PORT:-6379}:6379"
    command: redis-server --appendonly yes --maxmemory 256mb --maxmemory-policy allkeys-lru
    volumes:
      - redis_data:/data
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 10s
      timeout: 5s
      retries: 5
    networks:
      - monitoring-network

  # ─── Backend API ───────────────────────────────────────────────────────────
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: monitoring-backend
    restart: unless-stopped
    ports:
      - "${APP_PORT:-8000}:8000"
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER:-monitoring_user}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-monitoring_secret_2026}
      - DB_NAME=${POSTGRES_DB:-monitoring_db}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change-this-to-a-random-jwt-secret}
    volumes:
      - ./backend:/app
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
    networks:
      - monitoring-network

  # ─── Celery Worker ──────────────────────────────────────────────────────────
  celery_worker:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: monitoring-celery
    restart: unless-stopped
    command: celery -A app.celery_app worker --loglevel=info
    environment:
      - DB_HOST=postgres
      - DB_PORT=5432
      - DB_USER=${POSTGRES_USER:-monitoring_user}
      - DB_PASSWORD=${POSTGRES_PASSWORD:-monitoring_secret_2026}
      - DB_NAME=${POSTGRES_DB:-monitoring_db}
      - REDIS_HOST=redis
      - REDIS_PORT=6379
      - JWT_SECRET_KEY=${JWT_SECRET_KEY:-change-this-to-a-random-jwt-secret}
    volumes:
      - ./backend:/app
    depends_on:
      - backend
      - redis
    networks:
      - monitoring-network

volumes:
  postgres_data:
    driver: local
  redis_data:
    driver: local

networks:
  monitoring-network:
    driver: bridge
